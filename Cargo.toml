[package]
name = "agentos"
version = "0.1.0"
edition = "2021"
description = "Multi-agent OS assistant for open-weight models (Qwen, Hermes) served behind an OpenAI-compatible endpoint"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
